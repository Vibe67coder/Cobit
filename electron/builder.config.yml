appId: com.cobitx.estimating
productName: CobitX
copyright: Copyright (c) 2026 David Joia. All rights reserved.
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: engine/services/ifc_geometry.cjs
    to: ifc/ifc_geometry.cjs
  - from: node_modules/web-ifc/
    to: ifc/node_modules/web-ifc/
    filter:
      - package.json
      - web-ifc-api-node.js
      - web-ifc-node.wasm
      - LICENSE.md
  - from: engine/dist/
    to: engine/
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: CobitX-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CobitX Estimating
portable:
  artifactName: CobitX-Portable-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Office
